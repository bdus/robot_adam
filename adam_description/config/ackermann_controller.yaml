# 控制器配置（参考 carbot3d）
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    # 关节状态广播器
    adam_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      use_sim_time: true

# 关节状态广播器参数
adam_joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_steering_joint
      - front_left_drive_joint
      - front_right_steering_joint
      - front_right_drive_joint
      - rear_left_drive_joint
      - rear_right_drive_joint
    state_interfaces:
      - position
      - velocity
      - effort
